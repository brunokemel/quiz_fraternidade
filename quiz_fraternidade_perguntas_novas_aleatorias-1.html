<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Fraternidade | Nossa Senhora do Ó</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:18px;
  display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;color:#164766;
  background:#eaf4ff;
  position:relative;isolation:isolate;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(235,246,255,.38),rgba(235,246,255,.48)),
    url("https://upload.wikimedia.org/wikipedia/commons/0/08/Beata_Savina_Petrilli.jpg"),
    url("https://3.bp.blogspot.com/-sO_Zb-5neOE/VTFP4E4QDXI/AAAAAAAAFgY/gXFq3NvGR28/s1600/Beata%2BSavina%2BPetrilli%2B2.jpg");
  background-repeat:no-repeat,no-repeat,no-repeat;
  background-position:center,left 2% top 8%,right 2% bottom 8%;
  background-size:cover,min(34vw,310px) auto,min(34vw,330px) auto;
}
@media(max-width:640px){
  body{padding:14px;}
  body::before{
    background-image:
      linear-gradient(rgba(235,246,255,.22),rgba(235,246,255,.30)),
      url("https://upload.wikimedia.org/wikipedia/commons/0/08/Beata_Savina_Petrilli.jpg");
    background-position:center,center top 1%;
    background-size:cover,230px auto;
  }
}

.card{
  width:100%;max-width:440px;padding:24px;
  border-radius:24px;background:rgba(255,255,255,.84);
  border:2px solid #168bb8;box-shadow:0 12px 35px #07547b35;
}
.logo{width:110px;height:110px;margin:0 auto 12px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #168bb8;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain}
h1{text-align:center;color:#087eae;font-size:24px;margin:8px 0}
.sub{text-align:center;color:#39748e;margin:8px 0 20px}
.info{display:flex;justify-content:space-between;gap:10px;margin:18px 0;font-size:14px}
.barra{height:9px;border-radius:20px;overflow:hidden;background:#d8edf7}
#progresso{height:100%;width:0;background:linear-gradient(90deg,#087eae,#42c7df);transition:width .3s}
#pergunta{margin:22px 0;font-size:19px;font-weight:bold;line-height:1.4;color:#164766}
.opcao{display:block;width:100%;padding:13px;margin:8px 0;border:2px solid #c5e5f2;border-radius:13px;background:#f4fbff;color:#164766;text-align:left;font-size:15px;cursor:pointer}
.opcao:disabled{cursor:default}
.certa{background:#d3f7df;border-color:#249653}
.errada{background:#ffe0e0;border-color:#d33}
#feedback{margin:16px 0;line-height:1.5;font-size:14px;min-height:42px}
.principal{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#087eae,#13a9ca);color:white;font-size:16px;font-weight:bold;cursor:pointer}
#proximo{display:none}
#resultado{display:none;text-align:center}
#nota{color:#087eae;font-size:40px;font-weight:bold}
small{display:block;margin-top:18px;text-align:center;color:#39748e}
</style>

    <div class="info"><span id="numero">Questão 1/10</span><span id="pontos">⭐ 0 pontos</span></div>
    <div class="barra"><div id="progresso"></div></div>
    <div id="pergunta"></div>
    <div id="opcoes"></div>
    <div id="feedback"></div>
    <button id="proximo" class="principal" onclick="proxima()">Próxima questão ➜</button>
  </div>

  <div id="resultado">
    <h2>🏆 Quiz concluído!</h2>
    <div id="nota"></div>
    <p id="mensagem"></p>
    <button class="principal" onclick="reiniciar()">🔄 Jogar novamente</button>
  </div>
  <small>🤝 Respeito • Solidariedade • Fraternidade 🌎</small>
</div>

<script>
const bancoPerguntas=[
{p:"1. Qual é a principal finalidade da Campanha da Fraternidade?",o:["Arrecadar recursos exclusivamente para obras religiosas.","Despertar a reflexão e incentivar ações diante de problemas sociais.","Substituir todas as atividades da Igreja durante a Quaresma.","Promover apenas atividades de caridade entre pessoas católicas."],c:1,e:"A campanha busca conscientizar a sociedade e estimular ações concretas de fraternidade diante de desafios humanos e sociais."},
{p:"2. Por que a campanha acontece tradicionalmente durante a Quaresma?",o:["Porque a Quaresma é dedicada somente a arrecadações.","Porque nesse período não existem celebrações religiosas.","Porque a Quaresma convida à conversão, à oração e à mudança de atitudes.","Porque a Quaresma antecede o Natal."],c:2,e:"A Quaresma prepara para a Páscoa e convida à conversão e à revisão das atitudes pessoais e comunitárias."},
{p:"3. Qual é o papel da CNBB na Campanha da Fraternidade?",o:["Promover e coordenar a campanha em âmbito nacional na Igreja Católica do Brasil.","Fiscalizar todas as instituições sociais brasileiras.","Definir as políticas públicas dos municípios.","Administrar exclusivamente a assistência social do governo."],c:0,e:"A CNBB é a Conferência Nacional dos Bispos do Brasil e promove a campanha no âmbito da Igreja Católica brasileira."},
{p:"4. Uma comunidade faz doações, mas ignora as causas da pobreza. O que poderia melhorar essa ação?",o:["Encerrar todas as doações imediatamente.","Atender apenas quem participa da comunidade.","Substituir a solidariedade por punições às pessoas pobres.","Combinar ajuda imediata com reflexão e ações contra as causas da desigualdade."],c:3,e:"A solidariedade pode incluir ajuda direta, conscientização e iniciativas que enfrentem as causas dos problemas sociais."},
{p:"5. Qual alternativa expressa melhor a fraternidade?",o:["Ajudar somente em datas religiosas.","Reconhecer a dignidade humana e construir relações solidárias.","Ajudar apenas amigos e familiares.","Dispensar o respeito aos direitos das pessoas."],c:1,e:"A fraternidade envolve respeito, igualdade e responsabilidade pelo bem comum, para além de uma ajuda isolada."},
{p:"6. O que significa a dimensão social da campanha?",o:["Tratar exclusivamente de cerimônias religiosas.","Limitar-se à arrecadação de dinheiro para a Igreja.","Refletir sobre questões que afetam a sociedade e incentivar ações responsáveis.","Substituir o trabalho das escolas e dos governos."],c:2,e:"A dimensão social aborda problemas coletivos e incentiva respostas solidárias e responsáveis."},
{p:"7. Uma pessoa ajuda alguém, mas publica a ação para humilhar quem recebeu ajuda. Qual princípio foi desrespeitado?",o:["A dignidade e o respeito à pessoa ajudada.","A importância de divulgar todas as doações.","A necessidade de competir para ajudar mais.","O direito de escolher quem merece respeito."],c:0,e:"A solidariedade deve respeitar a dignidade de quem recebe ajuda, sem exposição humilhante ou discriminação."},
{p:"8. Como oração e ação se relacionam na proposta quaresmal?",o:["A oração torna desnecessário ajudar outras pessoas.","A ação social elimina a necessidade de reflexão.","São atividades incompatíveis.","A oração e a reflexão podem inspirar atitudes concretas de amor ao próximo."],c:3,e:"A vivência quaresmal reúne reflexão, oração e mudança de atitudes, expressando a fé também em ações solidárias."},
{p:"9. O que significa buscar o bem comum?",o:["Garantir vantagens exclusivas a quem tem mais recursos.","Favorecer condições dignas de vida para as pessoas e a comunidade.","Obrigar todos a pensar exatamente igual.","Priorizar interesses individuais em qualquer situação."],c:1,e:"O bem comum envolve condições sociais que permitem às pessoas e à comunidade viver com dignidade e desenvolver-se."},
{p:"10. Qual atitude demonstra compromisso com a fraternidade depois da Quaresma?",o:["Esperar até a próxima campanha para ajudar novamente.","Participar apenas quando houver recompensa.","Manter atitudes solidárias e colaborar com soluções para problemas da comunidade.","Considerar que os problemas sociais são responsabilidade exclusiva da Igreja."],c:2,e:"A fraternidade não precisa ficar restrita a uma época do ano. Ela pode orientar atitudes durante todo o ano."}
,{p:"11. O que a Campanha da Fraternidade procura despertar nas pessoas?",o:["Competição entre comunidades.","Consciência sobre desafios sociais e disposição para agir.","Interesse apenas por tradições antigas.","Vontade de evitar debates sobre a realidade."],c:1,e:"A campanha convida à reflexão sobre a realidade e à prática da fraternidade por meio de atitudes concretas."}
,{p:"12. Qual atitude combina melhor com a ideia de solidariedade?",o:["Ouvir as necessidades das pessoas e ajudar com respeito.","Decidir o que alguém precisa sem escutá-lo.","Ajudar somente se receber algo em troca.","Espalhar a situação da pessoa para todos."],c:0,e:"A solidariedade respeita as pessoas, escuta suas necessidades e procura oferecer apoio de forma digna."}
,{p:"13. Por que é importante conhecer as causas de um problema social?",o:["Para culpar quem sofre com o problema.","Para fingir que o problema não existe.","Para pensar em soluções mais eficazes e duradouras.","Para impedir que a comunidade participe."],c:2,e:"Conhecer as causas ajuda a comunidade a construir respostas que não se limitem a aliviar os efeitos imediatos."}
,{p:"14. Qual exemplo mostra participação cidadã e fraternidade?",o:["Ignorar problemas do bairro.","Espalhar boatos sobre uma família.","Esperar que apenas uma pessoa resolva tudo.","Organizar, com a comunidade, uma ação para melhorar um espaço público."],c:3,e:"A participação comunitária pode unir pessoas para cuidar dos espaços comuns e melhorar a vida coletiva."}
,{p:"15. O que deve orientar uma ação solidária?",o:["A busca por elogios e fama.","O respeito à dignidade e às necessidades das pessoas.","A separação entre pessoas consideradas importantes e não importantes.","A obrigação de todos pensarem igual."],c:1,e:"Uma ação solidária deve respeitar a dignidade humana e evitar discriminação ou humilhação."}
,{p:"16. Como os jovens podem viver a fraternidade na escola?",o:["Acolhendo colegas, evitando bullying e colaborando em atividades coletivas.","Excluindo quem tem opiniões diferentes.","Deixando toda responsabilidade para os professores.","Compartilhando mensagens para constranger colegas."],c:0,e:"Respeito, acolhimento e cooperação são formas concretas de construir fraternidade no ambiente escolar."}
,{p:"17. Qual é a diferença entre caridade pontual e compromisso contínuo?",o:["Não existe diferença: ajudar uma vez resolve tudo.","O compromisso contínuo é ajudar apenas em festas.","A caridade pontual pode atender uma urgência; o compromisso contínuo busca manter o cuidado e enfrentar problemas.","O compromisso contínuo dispensa qualquer ajuda imediata."],c:2,e:"A ajuda imediata é importante, e o compromisso contínuo permite manter o apoio e procurar mudanças duradouras."}
,{p:"18. Por que a campanha costuma escolher um tema a cada ano?",o:["Para impedir que outros assuntos sejam discutidos.","Para substituir todas as atividades comunitárias.","Para tratar sempre exatamente do mesmo problema.","Para destacar uma questão e orientar reflexão e ações sobre ela."],c:3,e:"O tema anual direciona a atenção para uma questão específica e ajuda a organizar reflexões e iniciativas."}
,{p:"19. Qual atitude ajuda a combater o preconceito?",o:["Repetir estereótipos sem verificar se são verdadeiros.","Respeitar as diferenças e avaliar cada pessoa com justiça.","Evitar conviver com quem é diferente.","Tratar algumas pessoas como menos dignas."],c:1,e:"Combater o preconceito exige respeito às diferenças e reconhecimento da dignidade de todas as pessoas."}
,{p:"20. O que significa transformar reflexão em ação?",o:["Conversar sobre um problema e nunca fazer nada.","Esperar que outra pessoa tome todas as iniciativas.","Escolher atitudes possíveis e colocá-las em prática para ajudar a comunidade.","Acreditar que problemas coletivos não têm solução."],c:2,e:"A reflexão pode orientar ações concretas, responsáveis e possíveis no cotidiano."}
,{p:"21. Qual opção representa cuidado com o bem comum?",o:["Preservar espaços coletivos e pensar no impacto das próprias atitudes.","Usar recursos compartilhados sem se importar com os outros.","Cuidar apenas do que pertence à própria família.","Impedir que outras pessoas participem das decisões."],c:0,e:"O bem comum depende de responsabilidade, cuidado com os espaços compartilhados e consideração pelas outras pessoas."}
,{p:"22. Em uma campanha solidária, como garantir que a ajuda seja respeitosa?",o:["Exigir que todos contem suas dificuldades em público.","Fotografar as pessoas sem pedir autorização.","Escolher quem merece ajuda pela aparência.","Organizar a ajuda com cuidado, privacidade e respeito às necessidades reais."],c:3,e:"A ajuda deve preservar a privacidade, evitar julgamentos e responder às necessidades de forma digna."}

];
let perguntas=[];
function prepararPerguntas(){
 const embaralhadas=[...bancoPerguntas].sort(()=>Math.random()-0.5);
 perguntas=embaralhadas.slice(0,10).map(q=>({...q,o:[...q.o]}));
}
let atual=0,pontos=0,respondeu=false;
function carregar(){
 respondeu=false;const q=perguntas[atual];
 // Embaralha as alternativas de cada pergunta, mantendo a resposta correta vinculada.
 if(!q.embaralhada){
   const alternativas=q.o.map((texto,i)=>({texto,correta:i===q.c}));
   for(let i=alternativas.length-1;i>0;i--){
     const j=Math.floor(Math.random()*(i+1));
     [alternativas[i],alternativas[j]]=[alternativas[j],alternativas[i]];
   }
   q.o=alternativas.map(a=>a.texto);
   q.c=alternativas.findIndex(a=>a.correta);
   q.embaralhada=true;
 }
 document.getElementById("numero").textContent=`Questão ${atual+1}/10`;
 document.getElementById("pontos").textContent=`⭐ ${pontos} pontos`;
 document.getElementById("progresso").style.width=`${atual/10*100}%`;
 document.getElementById("pergunta").textContent=q.p;
 document.getElementById("feedback").textContent="";
 document.getElementById("proximo").style.display="none";
 const area=document.getElementById("opcoes");area.innerHTML="";
 q.o.forEach((op,i)=>{const b=document.createElement("button");b.className="opcao";b.textContent=["A) ","B) ","C) ","D) "][i]+op;b.onclick=()=>responder(i,b);area.appendChild(b)});
}
function responder(escolha,botao){
 if(respondeu)return;respondeu=true;const q=perguntas[atual];
 document.querySelectorAll(".opcao").forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add("certa")});
 if(escolha===q.c){pontos++;document.getElementById("feedback").textContent="✅ Acertou! "+q.e}
 else{botao.classList.add("errada");document.getElementById("feedback").textContent="❌ Não foi dessa vez. "+q.e}
 document.getElementById("pontos").textContent=`⭐ ${pontos} pontos`;
 document.getElementById("progresso").style.width=`${(atual+1)/10*100}%`;
 const b=document.getElementById("proximo");b.style.display="block";b.textContent=atual===9?"Ver resultado 🏆":"Próxima questão ➜";
}
function proxima(){
 atual++;
 if(atual<perguntas.length)carregar();
 else{
  document.getElementById("jogo").style.display="none";document.getElementById("resultado").style.display="block";
  document.getElementById("nota").textContent=`${pontos}/10`;
  document.getElementById("mensagem").textContent=pontos===10?"Excelente! Você dominou o conteúdo!":pontos>=8?"Muito bem! Você entendeu os principais conceitos.":pontos>=6?"Bom trabalho! Revise as explicações para melhorar.":"Continue estudando! Reveja as explicações e tente novamente.";
 }
}
function reiniciar(){atual=0;pontos=0;prepararPerguntas();document.getElementById("jogo").style.display="block";document.getElementById("resultado").style.display="none";carregar()}
prepararPerguntas();
carregar();
</script>
</body>
</html>
